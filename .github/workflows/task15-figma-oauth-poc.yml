name: Task 15 Public Figma Prototype Embed

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/figma/public-embed.ts'
      - 'src/app/figma-poc/**'
      - 'tests/figma-public-embed.test.ts'
      - 'docs/figma-oauth-poc.md'
      - '.github/workflows/task15-figma-oauth-poc.yml'
  pull_request:
    paths:
      - 'src/lib/figma/public-embed.ts'
      - 'src/app/figma-poc/**'
      - 'tests/figma-public-embed.test.ts'
      - 'docs/figma-oauth-poc.md'
      - '.github/workflows/task15-figma-oauth-poc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  figma-public-embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Verify Task 15 public prototype embed contract
        run: node --test tests/figma-public-embed.test.ts
