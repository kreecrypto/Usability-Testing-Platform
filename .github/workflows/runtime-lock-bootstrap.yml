name: Runtime lock bootstrap

on:
  push:
    branches:
      - task/gwd-11-runtime
    paths:
      - 'package.json'
      - '.nvmrc'
      - '.github/workflows/runtime-lock-bootstrap.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/gwd-11-runtime
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package.json
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(runtime): commit generated npm lockfile'
          git push origin HEAD:task/gwd-11-runtime
