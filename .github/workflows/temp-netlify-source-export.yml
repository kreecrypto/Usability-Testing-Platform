name: Temporary Netlify Source Export

on:
  push:
    branches:
      - temp/netlify-source-export-20260909

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production candidate
        uses: actions/checkout@v4
        with:
          ref: 92db63206c56f14cbd58e78da2e021c8ff043838

      - name: Upload exact source tree
        uses: actions/upload-artifact@v4
        with:
          name: utp-main-92db632-source
          path: |
            .
            !.git/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
