name: Cloudflare Runtime Finalize

on:
  push:
    branches: [migration/cloudflare-runtime]
    paths:
      - .github/workflows/cloudflare-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/cloudflare-runtime

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Sync committed lockfile to exact runtime dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install from synchronized lockfile
        run: npm ci --no-audit --no-fund

      - name: Verify pinned dependency declarations
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          const bad = [];
          for (const group of ['dependencies', 'devDependencies']) {
            for (const [name, version] of Object.entries(pkg[group] || {})) {
              if (/^(latest|next|\*|\^|~)/.test(version)) bad.push(`${group}.${name}=${version}`);
            }
          }
          if (bad.length) {
            console.error(`Floating versions are forbidden:\n${bad.join('\n')}`);
            process.exit(1);
          }
          NODE

      - name: Existing UTP release gates
        run: |
          npm run check:design-system
          npm run check:high-fi
          npm run qa

      - name: vinext compatibility check
        run: npx --no-install vinext check

      - name: Cloudflare Workers build
        run: npm run build:vinext

      - name: Verify provider-minimal Wrangler contract
        run: |
          test -f wrangler.jsonc
          ! grep -q '<your-' wrangler.jsonc
          ! grep -q 'kv_namespaces' wrangler.jsonc
          ! grep -q '"images"' wrangler.jsonc

      - name: Commit synchronized lockfile and remove one-time finalizer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/cloudflare-bootstrap.yml
          git commit -m "Finalize Cloudflare Workers runtime configuration"
          git push origin HEAD:migration/cloudflare-runtime
