name: Design System QA

on:
  push:
    branches: [main]
    paths:
      - 'docs/design-system/**'
      - 'src/styles/**'
      - 'src/app/globals.css'
      - 'scripts/check-design-system.mjs'
      - 'package.json'
      - '.github/workflows/design-system-qa.yml'
  pull_request:
    paths:
      - 'docs/design-system/**'
      - 'src/styles/**'
      - 'src/app/globals.css'
      - 'scripts/check-design-system.mjs'
      - 'package.json'
      - '.github/workflows/design-system-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-system-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install from committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Verify AH 2.6 authority
        run: node scripts/check-design-system.mjs authority
      - name: Verify screen and state inventory
        run: node scripts/check-design-system.mjs inventory
      - name: Verify AH 2.6 canonical tokens
        run: node scripts/check-design-system.mjs tokens
      - name: Verify AH 2.6 component/layout baseline
        run: node scripts/check-design-system.mjs baseline
      - name: Verify AH 2.6 accessibility/state contract
        run: node scripts/check-design-system.mjs accessibility
      - name: Verify runtime consumes AH 2.6
        run: node scripts/check-design-system.mjs runtime
