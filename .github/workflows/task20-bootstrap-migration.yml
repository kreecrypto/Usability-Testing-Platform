name: Task 20 Bootstrap Supabase Migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/task20-bootstrap-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Generate migration with Supabase CLI
        run: npx --yes supabase@2.117.0 migration new initial_v1_schema

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "chore(task20): create Supabase initial schema migration"
          git push
