name: High-fi QA

on:
  push:
    branches: [main]
    paths:
      - 'src/app/high-fi/**'
      - 'src/app/globals.css'
      - 'src/styles/**'
      - 'docs/design-system/**'
      - 'scripts/check-high-fi.mjs'
      - 'scripts/check-design-system.mjs'
      - 'package.json'
      - '.github/workflows/high-fi-qa.yml'
  pull_request:
    paths:
      - 'src/app/high-fi/**'
      - 'src/app/globals.css'
      - 'src/styles/**'
      - 'docs/design-system/**'
      - 'scripts/check-high-fi.mjs'
      - 'scripts/check-design-system.mjs'
      - 'package.json'
      - '.github/workflows/high-fi-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  high-fi-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install from committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Check AH Design System v2.6 authority
        run: node scripts/check-design-system.mjs
      - name: Check high-fidelity coverage
        run: node scripts/check-high-fi.mjs
